name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: newday_ops_test
          MYSQL_USER: newday
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: base64:1ZJGqQmsi4O9P38qKJFrF/eeHixOrfd3M+4c7dA8kgc=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: newday_ops_test
      DB_USERNAME: newday
      DB_PASSWORD: test_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: php artisan migrate --force
      - run: php artisan db:seed --force
      - run: vendor/bin/pint --test
      - run: php artisan view:cache
      - run: php scripts/lint-compiled-views.php
      - run: php artisan test
      - name: Rehearse MySQL backup and isolated restore
        env:
          DB_USERNAME: root
          DB_PASSWORD: root_password
        run: |
          php artisan ops:backup --output=storage/app/backups/ci-phase5.sql
          php artisan ops:restore-verify storage/app/backups/ci-phase5.sql
      - name: Build isolated MySQL beta fixture
        env:
          APP_ENV: beta
          DB_CONNECTION: mysql
          DB_DATABASE: newday_ops_beta
          DB_USERNAME: root
          DB_PASSWORD: root_password
          BETA_DEMO_PASSWORD: BetaCiPassword123!
        run: |
          mysql -h 127.0.0.1 -uroot -proot_password -e "CREATE DATABASE newday_ops_beta CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          composer beta:setup
          composer beta:validate
          php artisan beta:benchmark --env=beta --runs=10 --fail-on-budget
      - name: Validate beta accessibility and responsive workflows
        env:
          APP_ENV: beta
          DB_CONNECTION: mysql
          DB_DATABASE: newday_ops_beta
          DB_USERNAME: root
          DB_PASSWORD: root_password
          BETA_DEMO_PASSWORD: BetaCiPassword123!
          BETA_BASE_URL: http://127.0.0.1:8001
        run: |
          npx playwright install --with-deps chromium
          php artisan serve --env=beta --host=127.0.0.1 --port=8001 > /tmp/ops-beta-server.log 2>&1 &
          npm run test:e2e
      - run: git diff --check
